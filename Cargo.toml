[package]
name = "skripsi_forensik"
version = "0.1.0"
edition = "2021"

[lib]
# NAMA INI HARUS "skripsi_forensik" AGAR SESUAI DENGAN lib.rs DAN PYTHON
name = "skripsi_forensik"
crate-type = ["cdylib"]

[dependencies]
# Kunci versinya di 0.20.0 agar sintaks kode kita tereksekusi dengan sempurna
pyo3 = { version = "0.20.0", features = ["extension-module"] }

# Pustaka lainnya
csv = "1.3"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10.0"