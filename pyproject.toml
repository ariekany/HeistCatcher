[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
# 1. NAMA WAJIB DISAMAKAN DENGAN CARGO.TOML
name = "skripsi_forensik"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

# 2. DAFTAR PUSTAKA PYTHON UNTUK PRESENTASI SKRIPSI
dependencies = [
    "jupyter",   # Untuk menjalankan Notebook
    "pandas",    # Untuk memanipulasi data di Python
    "pyvis",     # Untuk visualisasi graf jaringan interaktif
    "plotly",    # Untuk grafik Hukum Benford
    "numpy"      # Untuk kalkulasi logaritma Hukum Benford
]